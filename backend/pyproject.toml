[project]
name = "content-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Database
    "asyncpg>=0.30",
    "pgvector>=0.3",
    # Scheduling
    "apscheduler>=3.11",
    # Google AI
    "google-genai>=1.16",
    "google-adk>=1.2",
    # Storage & email
    "boto3>=1.38",
    "resend>=2.10",
    # Config & validation
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    # Logging
    "structlog>=25.3",
    # Utilities
    "python-dotenv>=1.1",
    "pillow>=12.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "mypy>=1.15",
    "ruff>=0.11",
]

[tool.mypy]
python_version = "3.12"
# NOTE: not `strict = true` yet — full strict surfaces pre-existing issues in the
# DB layer (e.g. bare `dict` in models.py). Enable strict in a pass coordinated
# with whoever owns those files. New modules here are written strict-clean.

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "pgvector.*",
    "boto3.*",
    "botocore.*",
    "resend.*",
    "apscheduler.*",
]
ignore_missing_imports = true
